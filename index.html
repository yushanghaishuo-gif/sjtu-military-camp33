<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050913">
  <title>玄学求雨祭坛｜天气预报只是建议</title>
  <meta name="description" content="在线注入法力，召唤乌云、雷公与萧老师演唱会级特大暴雨。">
  <style>
    :root{
      --night:#050811;--night-2:#091423;--panel:rgba(10,20,34,.72);
      --line:rgba(133,237,255,.22);--cyan:#78f3ff;--cyan-2:#34bce0;
      --gold:#ffd56b;--gold-2:#f4a72f;--ink:#13100a;--muted:#91a6b8;
      --prob:78.4%;--rain-opacity:.16;--storm-speed:1.1s;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-width:320px;color:#f3fbff;background:var(--night);font-family:Inter,"SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow-x:hidden}
    button,input{font:inherit}
    button{color:inherit}
    .scene{position:fixed;inset:0;z-index:-5;overflow:hidden;background:
      radial-gradient(ellipse at 50% -8%,rgba(95,170,204,.32),transparent 42%),
      radial-gradient(ellipse at 85% 50%,rgba(29,85,116,.14),transparent 45%),
      linear-gradient(155deg,#0d1c2c 0%,#060b16 42%,#03050a 100%)}
    .scene::after{content:"";position:absolute;inset:0;opacity:.24;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
    .cloud-bank{position:absolute;width:145vw;height:42vh;left:-20vw;border-radius:50%;filter:blur(34px);opacity:.43;background:
      radial-gradient(ellipse at 18% 55%,#53697b 0 10%,transparent 32%),
      radial-gradient(ellipse at 42% 42%,#425b70 0 15%,transparent 36%),
      radial-gradient(ellipse at 70% 58%,#263e54 0 17%,transparent 40%)}
    .cloud-bank.one{top:-16vh;animation:cloudDrift 19s ease-in-out infinite alternate}
    .cloud-bank.two{top:8vh;left:-35vw;opacity:.26;transform:scale(.8);animation:cloudDrift 31s ease-in-out infinite alternate-reverse}
    .rain-veil{position:absolute;inset:-30%;opacity:var(--rain-opacity);transform:rotate(11deg);background:repeating-linear-gradient(105deg,transparent 0 22px,rgba(142,232,255,.5) 23px,transparent 24px 50px);animation:rainVeil var(--storm-speed) linear infinite;transition:opacity .5s}
    #fx{position:fixed;inset:0;z-index:30;width:100%;height:100%;pointer-events:none}
    .lightning-flash{position:fixed;inset:0;z-index:29;pointer-events:none;background:#d8f8ff;opacity:0;mix-blend-mode:screen}
    body.flash .lightning-flash{animation:flash .64s steps(1)}
    body.shake .app{animation:shake .38s ease}

    .app{width:min(1440px,100%);margin:0 auto;padding:22px clamp(16px,3vw,42px) 38px;position:relative}
    .topbar{height:44px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(131,234,255,.13);color:#96aebe;font-size:11px;letter-spacing:.16em;text-transform:uppercase}
    .brandmark{display:flex;align-items:center;gap:10px;color:var(--cyan)}
    .brandmark i{display:grid;place-items:center;width:23px;height:23px;border:1px solid var(--cyan);border-radius:50%;font:normal 12px serif;box-shadow:0 0 18px rgba(94,235,255,.38)}
    .top-actions{display:flex;align-items:center;gap:12px}
    .live{display:flex;align-items:center;gap:7px}
    .live::before{content:"";width:6px;height:6px;border-radius:50%;background:#67ffd1;box-shadow:0 0 10px #67ffd1;animation:pulse 1.6s ease-in-out infinite}
    .sound-toggle{display:flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:99px;padding:7px 10px;background:rgba(5,12,22,.5);cursor:pointer;transition:.2s}
    .sound-toggle:hover{border-color:var(--cyan);color:#fff}.sound-icon{font-size:13px}

    .title-block{text-align:center;padding:34px 16px 14px;position:relative}
    .title-block::before,.title-block::after{content:"";position:absolute;top:71%;width:min(17vw,230px);height:1px;background:linear-gradient(90deg,transparent,var(--line))}
    .title-block::before{right:calc(50% + 260px)}.title-block::after{left:calc(50% + 260px);transform:scaleX(-1)}
    .kicker{margin:0 0 9px;color:var(--gold);font:600 10px ui-monospace,"SFMono-Regular",monospace;letter-spacing:.34em;text-transform:uppercase}
    h1{margin:0;font-family:"STKaiti","KaiTi",serif;font-size:clamp(44px,6vw,78px);font-weight:900;line-height:1.04;letter-spacing:.12em;color:#fff7d3;text-shadow:0 0 12px rgba(255,225,128,.26),0 0 32px rgba(50,199,255,.46),0 8px 34px #000}
    .subtitle{margin:11px 0 0;color:#94aabc;font-size:13px;letter-spacing:.08em}.subtitle b{color:#d6faff;font-weight:500}

    .altar-grid{display:grid;grid-template-columns:minmax(220px,278px) minmax(390px,1fr) minmax(220px,278px);grid-template-areas:"stats ritual intel";gap:18px;align-items:stretch;margin-top:18px}
    .glass{border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(15,31,47,.78),rgba(5,10,20,.72));box-shadow:inset 0 1px rgba(255,255,255,.05),0 22px 60px rgba(0,0,0,.34);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);position:relative;overflow:hidden}
    .glass::before{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.04),transparent 25%)}
